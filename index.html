<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakımda</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    text-align:center;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero h1{
    font-size:3rem;
}

.bakim{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

input{
    width:320px;
    padding:12px;
    margin:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:320px;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

footer{
    padding:40px 0;
}

.line{
    width:80%;
    margin:15px auto;
    border-top:2px solid #555;
}

.uyari{
    margin-top:25px;
    color:#ccc;
}

</style></head><body><section class="hero">
    <h1>Hoş Geldiniz</h1>
</section><section class="bakim"><h2>🚧 Site Şu Anda Bakımda 🚧</h2>
<br>
<p>Anlayışınız için teşekkür ederiz.</p>

<br><br>

<input
    type="text"
    id="adsoyad"
    placeholder="Ad Soyad">

<input
    type="date"
    id="dogumtarihi">

<button onclick="gonder()">
    Gönder
</button>

<div class="uyari">
    <p>DENEME AMAÇLIDIR!</p>
    <p>FOR TESTING PURPOSES ONLY!</p>
    <p>BY•NASTOXREAL</p>
    <p>İG•NASTOXREAL</p>
</div>

</section><footer><div class="line"></div>

<p>BY•PANKR_ANK</p>
<p>BY•NASTOXREAL</p>

<div class="line"></div>

</footer><script>

async function gonder(){

    let adsoyad =
        document.getElementById("adsoyad").value;

    let dogumtarihi =
        document.getElementById("dogumtarihi").value;

    try{

        await fetch(
            "http://192.168.1.38:5000/gonder",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    adsoyad: adsoyad,
                    dogumtarihi: dogumtarihi
                })
            }
        );

        alert("Bilgiler gönderildi.");

    }catch(e){

        alert("Sunucuya ulaşılamadı.");

        console.log(e);

    }

}

</script></body>
</html>
