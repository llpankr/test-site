<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakımda</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    text-align:center;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
}

.bakim{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

footer{
    padding:40px 0;
    border-top:2px solid #444;
    font-size:20px;
}

.line{
    width:80%;
    margin:10px auto;
    border-top:2px solid #555;
}
</style>
</head>

<body>

<section class="hero">
    <h1>Hoş Geldiniz</h1>
</section>

<section class="bakim">
    <h2>🚧 Site Şu Anda Bakımda 🚧</h2>
    <br>
    <p>Anlayışınız için teşekkür ederiz.</p>
</section>

<footer>
    <div class="line"></div>

    <p>BY•PANKR_ANK</p>
    <p>BY•NASTOXREAL</p>

    <div class="line"></div>
</footer>

</body>
</html>
