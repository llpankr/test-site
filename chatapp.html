<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NASTO XREAL</title>
<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
}
#chat{
    width:100%;
    height:300px;
    border:1px solid #444;
    overflow:auto;
    margin-bottom:10px;
    padding:10px;
}
input{
    width:100%;
    padding:10px;
    margin:5px 0;
}
button{
    padding:10px;
    width:100%;
}
</style>
</head>
<body>

<h2>NASTO XREAL</h2>

<input id="ip" placeholder="Sunucu IP">
<input id="username" placeholder="Kullanıcı Adı">

<div id="chat"></div>

<input id="message" placeholder="Mesaj">
<button onclick="sendMessage()">Gönder</button>

<script>
let ws;

function connect(){
    ws = new WebSocket("ws://" + document.getElementById("ip").value + ":5555");

    ws.onmessage = function(e){
        document.getElementById("chat").innerHTML += e.data + "<br>";
    };
}

function sendMessage(){
    if(ws){
        ws.send(
            document.getElementById("username").value +
            ": " +
            document.getElementById("message").value
        );
        document.getElementById("message").value="";
    }
}
</script>

<button onclick="connect()">Bağlan</button>

</body>
</html>
